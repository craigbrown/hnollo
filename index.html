<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f8fa" />
    <meta name="twitter:dnt" content="on" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hnollo" />
    <meta
      name="description"
      content="An unoffical Hacker News reader in the style of Apollo."
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Hnollo · Hacker News</title>
    <script>
      // Mobile Safari picks its status bar colour as the page first renders and
      // ignores later theme changes, so the theme can't wait for React.
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem("hnollo:v1")).preferences.theme;
        } catch (error) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
